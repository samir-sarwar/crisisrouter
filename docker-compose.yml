services:
  db:
    image: postgis/postgis:15-3.3
    platform: linux/amd64
    container_name: crisis_router_db
    environment:
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=crisis_router
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
